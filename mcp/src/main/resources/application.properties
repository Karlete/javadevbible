# ── MCP Server identity ────────────────────────────────────────────────
spring.ai.mcp.server.name=javadevbible
spring.ai.mcp.server.version=1.0.0

# ── STDIO transport ─────────────────────────────────────────────────────
# This server communicates via stdin/stdout. Claude Desktop (or Claude Code)
# launches it as a subprocess. There is no HTTP port and no network.
spring.ai.mcp.server.stdio=true

# ── No web server ───────────────────────────────────────────────────────
# CRITICAL: Spring Boot must not start Tomcat or any embedded server.
# Any non-JSON-RPC bytes on stdout silently break the STDIO protocol.
spring.main.web-application-type=none

# ── Silence stdout ──────────────────────────────────────────────────────
# The Spring Boot banner and all console log output must be suppressed.
# Anything printed to stdout that is not MCP protocol JSON is treated as
# a malformed message by the client and causes connection failure.
spring.main.banner-mode=off
logging.pattern.console=

# ── Log to file instead ─────────────────────────────────────────────────
# Logs still exist — they go to a file next to the JAR.
# Tail this file when debugging: tail -f javadevbible-mcp.log
logging.file.name=javadevbible-mcp.log
logging.level.root=INFO
logging.level.dev.javadevbible=DEBUG
